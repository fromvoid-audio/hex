[workspace]
members = ["crates/hex-plugin-scan", "crates/hex-warp", "crates/hex-diagnostics", "crates/hex-session", "crates/hex-storage", "crates/hex-media", "crates/hex-project", "crates/hex-lattice-contract", "crates/hex-lattice", "crates/hex-devices", "crates/hex-engine", "crates/hex-stream", "crates/hex-export", "crates/hex-library", "crates/hex-cli", "crates/hex-desktop", "crates/hex-ui", "crates/hex-audio", "crates/hex-preferences", "crates/hex-widgets"]
exclude = ["third_party/gpui", "third_party/block", "third_party/proc-macro-error2", "third_party/xattr"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Pinned external GPUI native-input repair; see docs/native-input.md.
[patch.crates-io]
gpui = { path = "third_party/gpui" }

# Pinned future-compatibility repairs; see docs/dependency-warnings.md.
block = { path = "third_party/block" }
proc-macro-error2 = { path = "third_party/proc-macro-error2" }

# Pinned external xattr Linux errno repair; see docs/xattr-compatibility.md.
xattr = { path = "third_party/xattr" }
