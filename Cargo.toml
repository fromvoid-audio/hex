[workspace]
default-members = ["crates/hex-desktop"]
members = ["crates/hex-mts", "crates/hex-tuning", "crates/hex-dsp", "crates/hex-midi", "crates/hex-clap-scan", "crates/hex-plugin-scan", "crates/hex-scan-supervisor", "crates/hex-plugin-catalog", "crates/hex-plugin-state", "crates/hex-plugin-host", "crates/hex-warp", "crates/hex-diagnostics", "crates/hex-report", "crates/hex-text", "crates/hex-session", "crates/hex-storage", "crates/hex-media", "crates/hex-project", "crates/hex-lattice-contract", "crates/hex-lattice", "crates/hex-devices", "crates/hex-engine", "crates/hex-stream", "crates/hex-export", "crates/hex-library", "crates/hex-cli", "crates/hex-desktop", "crates/hex-ui-model", "crates/hex-ui-kit", "crates/hex-ui", "crates/hex-sandbox", "crates/hex-audio", "crates/hex-preferences", "crates/hex-widgets"]
exclude = ["third_party/mts-esp-master", "third_party/hex-shm-ring", "third_party/hex-device-abi", "third_party/hex-device-abi-qual", "third_party/gpui", "third_party/block", "third_party/proc-macro-error2", "third_party/xattr", "third_party/cpal"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Pinned external GPUI native-input repair; see third_party/gpui/HEX-PATCHES.md.
[patch.crates-io]
gpui = { path = "third_party/gpui" }

# Pinned Core Audio route-probe repair; see third_party/cpal/HEX-PATCHES.md.
cpal = { path = "third_party/cpal" }

# Pinned future-compatibility repairs; see third_party/block/HEX-PATCHES.md and third_party/proc-macro-error2/HEX-PATCHES.md.
block = { path = "third_party/block" }
proc-macro-error2 = { path = "third_party/proc-macro-error2" }

# Pinned external xattr Linux errno repair; see third_party/xattr/HEX-PATCHES.md.
xattr = { path = "third_party/xattr" }

# Keep workspace dev/test backtraces legible with file names and line numbers
# while avoiding multi-hundred-MB full DWARF debuginfo that slows incremental
# links and macOS AMFI cold launches. Debug assertions, overflow checks, and
# release builds remain unchanged (Pulse #8987).
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Third-party crates (including path-patched ones such as gpui) compile optimized
# without DWARF debuginfo in dev and test builds; hex workspace crates keep
# line-table debuginfo, debug assertions, and overflow checks. GPUI-heavy suites
# are CPU-bound: the hex-ui ui-test-support suite ran 190 s at opt-level 0 and
# 58 s with opt-level 2 (31 October 2026). Release builds are unchanged.
[profile.dev.package."*"]
opt-level = 2
debug = 0

# hex-storage instantiates serde_json's generic encoder/decoder, so that code
# compiles at hex-storage's own opt-level. Its large-document suites decode 8 MiB
# projects through every frozen schema layer: audio_events.rs fell from 49 s to
# 16 s and provenance.rs from 47 s to 6 s at opt-level 1 (1 November 2026, Pulse
# #4010). Debug assertions and overflow checks stay enabled.
[profile.dev.package.hex-storage]
opt-level = 1

# Keep the full-rate Delay impulse and long-tail oracle under the < 1s unit-test
# budget without forcing opt-level 2 across every hex-devices incremental edit.
# Debug assertions and overflow checks remain enabled (Pulse #4153, #4838, #13518).
[profile.dev.package.hex-devices]
opt-level = 1

# Long verified-source import/reopen regressions preserve their real multi-million
# frame fixtures while staying within the per-test budget. Debug assertions and
# overflow checks remain enabled; release builds are unchanged (Pulse #4171).
[profile.dev.package.hex-media]
opt-level = 2

# Preserve the full long-source import, refusal and reopen fixtures while keeping
# their test setup and execution within the per-test budget. Debug assertions and
# overflow checks remain enabled; release builds are unchanged (Pulse #4172).
[profile.dev.package.hex-session]
opt-level = 1

# Keep full-rate warp regressions practical without weakening their fixtures.
# Debug assertions and overflow checks remain enabled (Pulse #4636).
[profile.dev.package.hex-warp]
opt-level = 1

# Keep CPU-bound DSP/rendering tests in hex-engine within the < 1s unit-test
# budget without weakening fixtures. Debug assertions and overflow checks remain
# enabled; release builds are unchanged (Pulse #8996).
[profile.dev.package.hex-engine]
opt-level = 1
