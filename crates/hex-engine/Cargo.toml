[package]
name = "hex-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
instrument-test-support = []

[lints]
workspace = true

[dependencies]
sha2 = "=0.11.0"
hex-warp = { path = "../hex-warp" }
hex-project = { path = "../hex-project" }
hex-devices = { path = "../hex-devices" }
hex-lattice = { path = "../hex-lattice" }
hex-lattice-contract = { path = "../hex-lattice-contract" }

[[example]]
name = "profile_shared_context"
required-features = ["instrument-test-support"]

[[example]]
name = "playback_stack"
required-features = ["instrument-test-support"]

[dev-dependencies]
hex-tuning = { path = "../hex-tuning" }
hex-lattice = { path = "../hex-lattice", features = ["conformance"] }
