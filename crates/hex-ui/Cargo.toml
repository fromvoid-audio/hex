[package]
name = "hex-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
ui-test-support = ["gpui/test-support", "hex-session/source-overview-test-support"]

[dependencies]
hex-plugin-catalog = { path = "../hex-plugin-catalog" }
hex-mts = { path = "../hex-mts" }
hex-tuning = { path = "../hex-tuning" }
hex-midi = { path = "../hex-midi" }
hex-diagnostics = { path = "../hex-diagnostics" }
hex-session = { path = "../hex-session" }
hex-project = { path = "../hex-project" }
hex-engine = { path = "../hex-engine" }
hex-audio = { path = "../hex-audio" }
hex-library = { path = "../hex-library" }
hex-preferences = { path = "../hex-preferences" }
hex-lattice-contract = { path = "../hex-lattice-contract" }
hex-widgets = { path = "../hex-widgets" }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "macos-blade"] }
serde_json = "=1.0.151"
# Loop tile sprites (RenderImage frames); the version gpui 0.2.2 already uses.
image = { version = "=0.25.9", default-features = false }

[dev-dependencies]
hex-devices = { path = "../hex-devices" }
hex-audio = { path = "../hex-audio", features = ["allocation-probe"] }
hex-media = { path = "../hex-media" }
resvg = { version = "=0.45.1", default-features = false }
usvg = { version = "=0.45.1", default-features = false }

[lints]
workspace = true
