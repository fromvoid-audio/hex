[package]
name = "hex-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
ui-test-support = ["gpui/test-support", "hex-session/source-overview-test-support", "hex-session/recovery-checkpoint-test-support"]
# Enables source-local pure tests in separately selected unit targets.
ui-unit-tier = []

[[test]]
name = "unit_piano_roll"
path = "tests/unit_piano_roll.rs"
required-features = ["ui-unit-tier"]

[[test]]
name = "unit_timeline"
path = "tests/unit_timeline.rs"
required-features = ["ui-unit-tier"]

[[test]]
name = "unit_automation"
path = "tests/unit_automation.rs"
required-features = ["ui-unit-tier"]

[[test]]
name = "unit_device"
path = "tests/unit_device.rs"
required-features = ["ui-unit-tier"]

[[test]]
name = "unit_section"
path = "tests/unit_section.rs"
required-features = ["ui-unit-tier"]

[[test]]
name = "unit_editor_logic"
path = "tests/unit_editor_logic.rs"
required-features = ["ui-unit-tier"]

[[test]]
name = "midi_pressure_boundary"
path = "tests/midi_pressure_boundary.rs"
required-features = ["ui-test-support"]

[dependencies]
# UI-only random result selection; already pinned in the workspace lock graph.
fastrand = "=2.5.0"
hex-plugin-catalog = { path = "../hex-plugin-catalog" }
hex-mts = { path = "../hex-mts" }
hex-tuning = { path = "../hex-tuning" }
hex-midi = { path = "../hex-midi" }
hex-diagnostics = { path = "../hex-diagnostics" }
hex-session = { path = "../hex-session" }
hex-project = { path = "../hex-project" }
hex-engine = { path = "../hex-engine" }
hex-audio = { path = "../hex-audio" }
hex-library = { path = "../hex-library" }
hex-preferences = { path = "../hex-preferences" }
hex-lattice-contract = { path = "../hex-lattice-contract" }
hex-widgets = { path = "../hex-widgets" }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "macos-blade"] }
serde_json = "=1.0.151"
# Loop tile sprites (RenderImage frames); the version gpui 0.2.2 already uses.
image = { version = "=0.25.9", default-features = false }

[dev-dependencies]
# Complete control-side EQ upgrade project save/reopen fixture only.
hex-storage = { path = "../hex-storage" }
hex-devices = { path = "../hex-devices" }
hex-audio = { path = "../hex-audio", features = ["allocation-probe"] }
hex-media = { path = "../hex-media" }
resvg = { version = "=0.45.1", default-features = false }
usvg = { version = "=0.45.1", default-features = false }

[lints]
workspace = true
