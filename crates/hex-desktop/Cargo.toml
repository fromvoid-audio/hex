[package]
name = "hex-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Constructor/adapter integration only; no physical device is opened by fixtures.
allocation-probe = ["hex-audio/allocation-probe"]

[dependencies]
hex-midi = { path = "../hex-midi" }
hex-diagnostics = { path = "../hex-diagnostics" }
hex-ui = { path = "../hex-ui" }
hex-audio = { path = "../hex-audio" }
hex-engine = { path = "../hex-engine" }
hex-session = { path = "../hex-session" }
hex-stream = { path = "../hex-stream" }
hex-media = { path = "../hex-media" }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "macos-blade"] }

[dev-dependencies]
hex-project = { path = "../hex-project" }
allocation-counter = "=0.8.1"

[lints]
workspace = true
