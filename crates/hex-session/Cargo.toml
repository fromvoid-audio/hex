[package]
name = "hex-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Peak-only construction/allocator probes; no native source authority.
source-overview-test-support = []

[dependencies]
hex-storage = { path = "../hex-storage" }
hex-engine = { path = "../hex-engine" }
hex-media = { path = "../hex-media" }
hex-project = { path = "../hex-project" }
hex-lattice-contract = { path = "../hex-lattice-contract" }
# Pure saved-envelope identity validation; no runtime/ABI or source custody.
hex-plugin-state = { path = "../hex-plugin-state" }
hex-export = { path = "../hex-export" }
hex-tuning = { path = "../hex-tuning" }

[dev-dependencies]
hex-engine = { path = "../hex-engine", features = ["instrument-test-support"] }
hex-tuning = { path = "../hex-tuning" }
serde_json = "=1.0.151"
