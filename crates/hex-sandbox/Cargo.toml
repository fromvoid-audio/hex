[package]
name = "hex-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
ui-test-support = ["gpui/test-support"]
# Shared source files use this test-only gate; it has no runtime effect.
ui-unit-tier = []

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "macos-blade"] }
hex-devices = { path = "../hex-devices" }
hex-preferences = { path = "../hex-preferences" }
hex-project = { path = "../hex-project" }
hex-widgets = { path = "../hex-widgets" }

[lints]
workspace = true
