[package]
name = "hex-stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
allocation-probe = []
test-support = []

[lints]
workspace = true

[dependencies]
hex-engine = { path = "../hex-engine" }
hex-media = { path = "../hex-media" }
hex-project = { path = "../hex-project" }
hex-storage = { path = "../hex-storage" }
rtrb = "=0.3.4"

[dev-dependencies]
hex-media = { path = "../hex-media", features = ["test-support"] }
allocation-counter = "=0.8.1"

[build-dependencies]
sha2 = "=0.11.0"

[[test]]
name = "callback_allocations"
required-features = ["allocation-probe"]
