[package]
name = "hex-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Headless copied endpoint probes; no production counter dependency.
allocation-probe = []
# Queue witness for owning audio tests; not an admission or readiness fact.
test-support = []
# Opt-in native macOS arm64 VST3 SDK integration suite; absent from normal builds.
vst3-sdk-tests = ["allocation-probe", "test-support"]

[[test]]
name = "native_vst3_sdk"
path = "src/native_vst3_sdk_test.rs"
required-features = ["vst3-sdk-tests"]

[dev-dependencies]
allocation-counter = "=0.8.1"

[dependencies]
hex-plugin-scan = { path = "../hex-plugin-scan" }
hex-plugin-state = { path = "../hex-plugin-state" }
hex-lattice-contract = { path = "../hex-lattice-contract" }
rtrb = "=0.3.4"

[target.'cfg(unix)'.dependencies]
# Bounded control/worker socket readiness only; no process/signal feature here.
rustix = { version = "=1.1.5", features = ["event"] }
