[package]
name = "hex-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
instrument-test-support = ["hex-engine/instrument-test-support"]

[dependencies]
hex-engine = { path = "../hex-engine" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[dev-dependencies]
hex-tuning = { path = "../hex-tuning" }
hex-project = { path = "../hex-project" }
hex-lattice = { path = "../hex-lattice", features = ["conformance"] }
hex-lattice-contract = { path = "../hex-lattice-contract" }

[lints]
workspace = true
