[package]
name = "hex-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Instrumented headless tests only; never referenced by production code.
allocation-probe = ["hex-engine/instrument-test-support"]

[dependencies]
hex-engine = { path = "../hex-engine" }
hex-stream = { path = "../hex-stream" }
cpal = "=0.17.3"
rtrb = "=0.3.4"
# Only the five private native-custody fields; explicit type avoids alias feature selection.
spin = { version = "=0.9.9", default-features = false, features = ["mutex", "spin_mutex", "std"] }

[dev-dependencies]
hex-tuning = { path = "../hex-tuning" }
hex-media = { path = "../hex-media" }
hex-project = { path = "../hex-project" }
hex-lattice-contract = { path = "../hex-lattice-contract" }
hex-lattice = { path = "../hex-lattice", features = ["conformance"] }
allocation-counter = "=0.8.1"

[lints]
workspace = true
