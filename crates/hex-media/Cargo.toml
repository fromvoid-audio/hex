[package]
name = "hex-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Deterministic control/worker read-error qualification; absent from default builds.
test-support = []

[lints]
workspace = true

[dependencies]
hex-engine = { path = "../hex-engine" }
hex-project = { path = "../hex-project" }
sha2 = "=0.11.0"

[dev-dependencies]
hex-devices = { path = "../hex-devices" }
hex-lattice = { path = "../hex-lattice" }
hex-lattice-contract = { path = "../hex-lattice-contract" }

# Dev-only old software backend oracle for durable SHA256 byte compatibility.
sha2_legacy = { package = "sha2", version = "=0.10.9" }
